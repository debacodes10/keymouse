# Keymouse configuration example
# Copy this to ~/Library/Application Support/keymouse/config.toml and edit values.

# Toggle mouse mode on/off
# Supports function keys like "f1"..."f12"
toggle_key = "f1"

# Cursor movement keys (single key names)
movement_up = "k"
movement_down = "j"
movement_left = "h"
movement_right = "l"

# Scroll keys
scroll_up = "u"
scroll_down = "n"
scroll_left = "b"
scroll_right = "m"

# Grid mode controls
grid_key = ";"
grid_selection_keys = ["q", "w", "e", "a", "s", "d", "z", "x", "c"]
confirm_key = "enter"

# Mouse click keys
left_click = "f"
right_click = "d"
drag_toggle = "v" # Toggle left-button hold for drag (press again to release)

# Movement speed modifiers
# Supported values: "shift", "option" (or "alt")
fast_modifier = "shift"
slow_modifier = "option"

# Grid overlay visuals
# Available values: "classic", "midnight", "ocean", "forest"
grid_theme = "classic"
# Overlay opacity multiplier (0.0 to 1.0)
grid_opacity = 1.0
# Optional grid accent color in hex format (#RRGGBB). Leave empty to use theme defaults.
grid_color = ""
# Optional visual label override. Leave commented out to show the configured grid keys.
# grid_labels = ["Q", "W", "E", "A", "S", "D", "Z", "X", "C"]

# HUD overlay (shows current mode and recent actions while mouse mode is on)
hud_enabled = true
hud_show_last_action = true
hud_unknown_key_hint = false
hud_opacity = 0.9
# Available values: "top_left", "top_right", "bottom_left", "bottom_right"
hud_position = "top_right"
